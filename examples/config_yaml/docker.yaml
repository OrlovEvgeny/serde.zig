# Compose-style subset used by this example. Images are illustrative.
services:
  web:
    image: nginx:1.25
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - api
  api:
    image: orders-api:2.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_HOST: db
      LOG_LEVEL: info
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders

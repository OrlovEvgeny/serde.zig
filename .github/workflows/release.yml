name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          # Releases are cut from the stable compatibility target documented in README.md.
          version: 0.15.2

      - name: Run tests
        run: zig build test

  version:
    name: Version metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version metadata matches the tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          zon=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          readme=$(sed -n 's|.*archive/refs/tags/v\([0-9][^/]*\)\.tar\.gz.*|\1|p' README.md)
          status=0
          if [ "$zon" != "$tag" ]; then
            echo "build.zig.zon .version is \"$zon\", expected \"$tag\"" >&2
            status=1
          fi
          if [ "$readme" != "$tag" ]; then
            echo "README.md tarball URL points at v$readme, expected v$tag" >&2
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Bump the version in build.zig.zon and README.md before tagging." >&2
            exit 1
          fi
          echo "Version metadata matches $GITHUB_REF_NAME."

  release:
    name: Create Release
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          prev_tag=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ "$prev_tag" = "$GITHUB_REF_NAME" ] || [ -z "$prev_tag" ]; then
            echo "body<<ENDOFLOG" >> "$GITHUB_OUTPUT"
            echo "Initial release." >> "$GITHUB_OUTPUT"
            echo "ENDOFLOG" >> "$GITHUB_OUTPUT"
          else
            echo "body<<ENDOFLOG" >> "$GITHUB_OUTPUT"
            echo "## What's Changed" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            git log "${prev_tag}..HEAD" --pretty=format:"- %s (%h)" --no-merges >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "**Full diff**: https://github.com/${{ github.repository }}/compare/${prev_tag}...${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "ENDOFLOG" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
